# Stages a new npm version when a GitHub release is published (tag vX.Y.Z = the version in package.json).
# npm trusted publishing: GitHub's OIDC token proves the run comes from this repo and workflow,
# so there is no npm token stored anywhere, and npm adds provenance to the version.
# The trusted publisher may only stage: the version goes live after the maintainer approves it
# on npmjs.com (or `npm stage approve <id>`) with 2FA.
name: Stage on npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: 24   # npm 12 needs 24.15 or later; 24 is the newest 24.x
          registry-url: https://registry.npmjs.org
      - name: Release tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v$v" || { echo "Tag ${GITHUB_REF_NAME} but package.json says $v"; exit 1; }
      - name: npm 12.2.2 (npm 11 has no `npm stage`)
        run: npm install -g npm@12.2.2
      - run: npm test
      - run: npm stage publish .
